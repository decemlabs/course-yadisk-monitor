name: monitor-yadisk

on:
  schedule:
    - cron: "0 17 * * *"   # 20:00 МСК (UTC+3, без перехода на летнее время)
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests
      - run: python monitor.py
      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%F)" || echo "nothing to commit"
          git push
